---
- name: Configure DevOps VM
  hosts: devops
  become: true

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Docker
      apt:
        name: docker.io
        state: present

    - name: Ensure Docker is running
      service:
        name: docker
        state: started
        enabled: yes
    - name: Add mariem user to Docker group
      user:
        name: mariem
        groups: docker
        append: true
