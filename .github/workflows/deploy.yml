name: Build and Deploy

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login \
            meriemdevopsacr2026.azurecr.io \
            -u "${{ secrets.ACR_USERNAME }}" \
            --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t meriemdevopsacr2026.azurecr.io/meriem-app:latest \
            ./app

      - name: Push Docker image to ACR
        run: |
          docker push \
            meriemdevopsacr2026.azurecr.io/meriem-app:latest

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy image to VM
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
            echo "${{ secrets.ACR_PASSWORD }}" | docker login \
              meriemdevopsacr2026.azurecr.io \
              -u "${{ secrets.ACR_USERNAME }}" \
              --password-stdin

            docker pull meriemdevopsacr2026.azurecr.io/meriem-app:latest

            docker stop meriem-app || true
            docker rm meriem-app || true

            docker run -d \
              --name meriem-app \
              --restart unless-stopped \
              -p 80:80 \
              meriemdevopsacr2026.azurecr.io/meriem-app:latest
          EOF
