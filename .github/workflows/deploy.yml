name: Build and Deploy to AKS

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "k8s/**"
      - ".github/workflows/deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login \
            meriemdevopsacr2026.azurecr.io \
            -u "${{ secrets.ACR_USERNAME }}" \
            --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t meriemdevopsacr2026.azurecr.io/meriem-app:${{ github.sha }} \
            -t meriemdevopsacr2026.azurecr.io/meriem-app:latest \
            ./app

      - name: Push Docker image
        run: |
          docker push meriemdevopsacr2026.azurecr.io/meriem-app:${{ github.sha }}
          docker push meriemdevopsacr2026.azurecr.io/meriem-app:latest

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group rg-devops-project \
            --name aks-devops \
            --overwrite-existing

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/configmap.yml
          kubectl apply -f k8s/secret.yml
          kubectl apply -f k8s/service.yml
          kubectl apply -f k8s/ingress.yml

      - name: Deploy new image to AKS
        run: |
          kubectl set image deployment/meriem-app \
            meriem-app=meriemdevopsacr2026.azurecr.io/meriem-app:${{ github.sha }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/meriem-app --timeout=180s
